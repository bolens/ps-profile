name: Dependencies - Validation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'requirements/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/utils/dependencies/**'
      - 'scripts/lib/**'
      - '.github/workflows/dependency-validation.yml'
  push:
    branches: [ main ]
    paths:
      - 'requirements/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/utils/dependencies/**'
      - 'scripts/lib/**'
      - '.github/workflows/dependency-validation.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  issues: write

jobs:
  validate-dependencies:
    name: Validate Dependencies
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7


      - name: Validate Dependencies
        id: validate-deps
        run: |
          pwsh -NoProfile -File scripts/utils/dependencies/validate-dependencies.ps1
        continue-on-error: false

      - name: Comment PR with Dependency Status
        if: github.event_name == 'pull_request' && steps.validate-deps.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Dependency Validation Passed**\n\nAll required dependencies are available and meet version requirements.'
            })

      - name: Comment PR with Dependency Issues
        if: failure() && github.event_name == 'pull_request' && steps.validate-deps.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Dependency Validation Failed**\n\nPlease check the workflow logs for details on missing or invalid dependencies.'
            })
