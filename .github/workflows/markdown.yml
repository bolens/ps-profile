name: Docs - Markdown lint + link-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '.markdownlint*'
      - 'markdownlint*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/markdown.yml'
  push:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '.markdownlint*'
      - 'markdownlint*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/markdown.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.3
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run markdownlint
        run: >
          pnpm exec markdownlint
          README.md WARP.md AGENTS.md ARCHITECTURE.md CONTRIBUTING.md
          PROFILE_README.md PROFILE_DEBUG.md profile.d/README.md
          requirements/README.md scripts/utils/README.md scripts/examples/README.md
          docs/README.md
      - name: Check links in README
        run: pnpm dlx markdown-link-check README.md
