name: CI - PowerShell (matrix)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'Microsoft.PowerShell_profile.ps1'
      - 'profile.d/**'
      - 'requirements/**'
      - 'scripts/checks/**'
      - 'scripts/lib/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/**'
      - '.github/actions/setup-arch-linux/**'
      - '.devcontainer/install-pwsh-linux.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'Microsoft.PowerShell_profile.ps1'
      - 'profile.d/**'
      - 'requirements/**'
      - 'scripts/checks/**'
      - 'scripts/lib/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/**'
      - '.github/actions/setup-arch-linux/**'
      - '.devcontainer/install-pwsh-linux.sh'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  POWERSHELL_TELEMETRY_OPTOUT: "1"

permissions:
  contents: read

jobs:
  workflow-security:
    name: Workflow security
    permissions:
      contents: read
    uses: bolens/.github/.github/workflows/reusable-actionlint.yml@b179e4783aca035374a85da9676e0be893fa1701
    with:
      security-audit: true

  validate:
    name: Validate on ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest
            os: ubuntu-latest
            container: null
          - label: windows-latest
            os: windows-latest
            container: null
          # Arch has no hosted runner: host on ubuntu-latest, run inside archlinux container.
          - label: arch-latest
            os: ubuntu-latest
            container: archlinux:latest@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    container: ${{ matrix.container }}
    steps:
      # Arch images ship without git; checkout then uses a REST archive (no .git).
      - name: Bootstrap Arch git for checkout
        if: matrix.label == 'arch-latest'
        shell: bash
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm
          pacman -S --noconfirm git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Trust workspace for git (Arch container)
        if: matrix.label == 'arch-latest'
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup Arch Linux
        if: matrix.label == 'arch-latest'
        uses: ./.github/actions/setup-arch-linux # zizmor: ignore[self-repository] actionlint 1.7.12 requires the current local-action syntax.
        with:
          pwsh-version: 7.4.7
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Validate profile (lint + idempotency)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/checks/validate-profile.ps1
