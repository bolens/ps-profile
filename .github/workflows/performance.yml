name: Performance - Benchmark

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Microsoft.PowerShell_profile.ps1'
      - 'profile.d/**'
      - 'scripts/utils/metrics/**'
      - 'scripts/lib/performance/**'
      - 'scripts/utils/code-quality/run-performance-batch.ps1'
      - 'tests/performance/**'
      - '.github/workflows/performance.yml'
  push:
    branches: [ main ]
    paths:
      - 'Microsoft.PowerShell_profile.ps1'
      - 'profile.d/**'
      - 'scripts/utils/metrics/**'
      - 'scripts/lib/performance/**'
      - 'scripts/utils/code-quality/run-performance-batch.ps1'
      - 'tests/performance/**'
      - '.github/workflows/performance.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Performance Benchmark
        timeout-minutes: 20
        # Bound wall-clock: 2 full-profile iterations + 1 pass over fragments.
        # Async I/O drain + no PSReadLine in fragment probes avoids CI hangs.
        run: >
          pwsh -NoProfile -File scripts/utils/metrics/benchmark-startup.ps1
          -Iterations 2
          -FragmentIterations 1
          -FragmentTimeoutSeconds 15
      - name: Update Performance Baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        timeout-minutes: 20
        run: >
          pwsh -NoProfile -File scripts/utils/metrics/benchmark-startup.ps1
          -Iterations 3
          -FragmentIterations 1
          -FragmentTimeoutSeconds 15
          -UpdateBaseline
      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-results
          path: |
            scripts/data/startup-benchmark.csv
            scripts/data/performance-baseline.json
          if-no-files-found: warn
