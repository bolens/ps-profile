name: Test - Pester

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  POWERSHELL_TELEMETRY_OPTOUT: "1"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      any: ${{ steps.build.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect PR paths
        if: github.event_name == 'pull_request'
        id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          list-files: json
          filters: |
            changed:
              - '**'

      - name: Build matrix from shared shard filter
        id: build
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ steps.paths.outputs.changed_files }}
        run: |
          $filterModule = Join-Path $env:GITHUB_WORKSPACE 'scripts/utils/code-quality/modules/PesterCiShardFilter.psm1'
          Import-Module $filterModule -Force -DisableNameChecking

          if ($env:EVENT_NAME -ne 'pull_request') {
            $shards = @(Resolve-PesterCiShards -All)
          }
          else {
            # Dorny fails the job on API errors. Never turn absent output into
            # a successful empty selection; filenames remain JSON data.
            if ([string]::IsNullOrWhiteSpace($env:CHANGED_FILES)) {
              throw 'Missing changed-file output from paths-filter'
            }
            $changed = @(ConvertFrom-Json -InputObject $env:CHANGED_FILES)
            $shards = @(Resolve-PesterCiShards -ChangedFiles $changed)
          }

          # Coerce to [string[]] so empty "no matching shards" stays an empty array
          # (bare @() / $null can bind as '' and fail Mandatory [string[]]).
          $shardList = [string[]]@($shards | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          $include = @(Get-PesterCiShardMatrix -Shards $shardList)
          $any = $include.Count -gt 0
          $matrix = if ($any) {
            @{ include = @($include) } | ConvertTo-Json -Compress -Depth 5
          }
          else {
            @{ include = @(@{
                  label     = 'ubuntu-latest'
                  os        = 'ubuntu-latest'
                  container = $null
                  shard     = 'unit-library'
                }) } | ConvertTo-Json -Compress -Depth 5
          }

          $output = @(
            'matrix<<EOF'
            $matrix
            'EOF'
            "any=$($any.ToString().ToLowerInvariant())"
          ) -join "`n"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $output -Encoding utf8
          Write-Host "Enabled shards: $($shards -join ', ')"
          Write-Host "Matrix jobs: $($include.Count)"

  test:
    name: test (${{ matrix.label }}, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      # Arch images ship without git; checkout then uses a REST archive (no .git).
      - name: Bootstrap Arch git for checkout
        if: matrix.label == 'arch-latest'
        shell: bash
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm
          pacman -S --noconfirm git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Trust workspace for git (Arch container)
        if: matrix.label == 'arch-latest'
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup Arch Linux
        if: matrix.label == 'arch-latest'
        uses: ./.github/actions/setup-arch-linux # zizmor: ignore[self-repository] actionlint 1.7.12 requires the current local-action syntax.
        with:
          pwsh-version: 7.4.7
      - name: Install Pester
        shell: pwsh
        run: |
          $galleryName = 'PSGallery'
          if (-not (Get-PSRepository -Name $galleryName -ErrorAction SilentlyContinue)) {
            try {
              Register-PSRepository -Default -ErrorAction Stop
            }
            catch {
              Write-Warning "Could not restore the default PSGallery registration: $($_.Exception.Message)"
            }
            if (-not (Get-PSRepository -Name $galleryName -ErrorAction SilentlyContinue)) {
              # Register-PSRepository can emit a non-terminating NuGet error and
              # return without creating PSGallery, especially on Windows images.
              $galleryName = 'PSGalleryFallback'
              if (-not (Get-PSRepository -Name $galleryName -ErrorAction SilentlyContinue)) {
                Register-PSRepository `
                  -Name $galleryName `
                  -SourceLocation 'https://www.powershellgallery.com/api/v2' `
                  -PublishLocation 'https://www.powershellgallery.com/api/v2/package/' `
                  -ScriptSourceLocation 'https://www.powershellgallery.com/api/v2/items/psscript' `
                  -ScriptPublishLocation 'https://www.powershellgallery.com/api/v2/package/' `
                  -InstallationPolicy Trusted
              }
            }
          }
          Set-PSRepository -Name $galleryName -InstallationPolicy Trusted
          # Pin to 5.7.x: Pester 5.9+ regresses Mock scoping ("Mock data are not setup for this scope")
          # and TestDrive collisions across sequential containers; Pester 6+ breaks tracer teardown.
          Install-Module -Name Pester -Repository $galleryName -MinimumVersion 5.7.0 -MaximumVersion 5.7.99 -Force -Scope CurrentUser -AllowClobber
          $pester5 = Get-Module -ListAvailable Pester |
            Where-Object { $_.Version -ge [version]'5.7.0' -and $_.Version -lt [version]'5.8.0' } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $pester5) { throw 'Pester 5.7.x is required but was not installed' }
          Import-Module Pester -RequiredVersion $pester5.Version -Force
          Write-Host "Installed Pester $($pester5.Version)"
      - name: Run Pester shard
        shell: pwsh
        env:
          PESTER_SHARD: ${{ matrix.shard }}
        run: |
          pwsh -NoProfile -NonInteractive -File scripts/utils/code-quality/run-pester-ci-shard.ps1 -Shard "$env:PESTER_SHARD" -Quiet
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pester-${{ matrix.label }}-${{ matrix.shard }}
          path: tests/test-artifacts/ci-${{ matrix.shard }}/**
          if-no-files-found: ignore
      - name: Upload coverage report
        if: matrix.shard == 'coverage-smoke' && matrix.label == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-ubuntu-smoke
          path: |
            coverage.xml
            tests/test-artifacts/ci-coverage-smoke/**

  ci-result:
    name: Pester result
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful applicable checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["NEEDS_JSON"])
          selected = jobs["changes"].get("outputs", {}).get("any")
          expected = "success" if selected == "true" else "skipped"
          if (jobs["changes"]["result"] != "success"
                  or selected not in ("true", "false")
                  or jobs["test"]["result"] != expected):
              print("Pester selection or required shard execution failed")
              sys.exit(1)
          PYTHON
