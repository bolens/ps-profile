name: Test - Pester

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  POWERSHELL_TELEMETRY_OPTOUT: "1"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      any: ${{ steps.build.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build matrix from shared shard filter
        id: build
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $filterModule = Join-Path $env:GITHUB_WORKSPACE 'scripts/utils/code-quality/modules/PesterCiShardFilter.psm1'
          Import-Module $filterModule -Force -DisableNameChecking

          $isDispatch = $env:EVENT_NAME -eq 'workflow_dispatch'
          if ($isDispatch) {
            $shards = @(Resolve-PesterCiShards -All)
          }
          else {
            $base = $env:BASE_SHA
            $head = $env:HEAD_SHA
            if ([string]::IsNullOrWhiteSpace($base) -or [string]::IsNullOrWhiteSpace($head)) {
              $shards = @(Resolve-PesterCiShards -All)
            }
            else {
              $changed = @(git diff --name-only --diff-filter=ACMRD "${base}...${head}")
              Write-Host "Changed files: $($changed.Count)"
              $shards = @(Resolve-PesterCiShards -ChangedFiles $changed)
            }
          }

          $include = @(Get-PesterCiShardMatrix -Shards $shards)
          $any = $include.Count -gt 0
          $matrix = if ($any) {
            @{ include = @($include) } | ConvertTo-Json -Compress -Depth 5
          }
          else {
            @{ include = @(@{
                  label     = 'ubuntu-latest'
                  os        = 'ubuntu-latest'
                  container = $null
                  shard     = 'unit-library'
                }) } | ConvertTo-Json -Compress -Depth 5
          }

          $output = @(
            'matrix<<EOF'
            $matrix
            'EOF'
            "any=$($any.ToString().ToLowerInvariant())"
          ) -join "`n"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $output -Encoding utf8
          Write-Host "Enabled shards: $($shards -join ', ')"
          Write-Host "Matrix jobs: $($include.Count)"

  test:
    name: test (${{ matrix.label }}, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      # Arch images ship without git; checkout then uses a REST archive (no .git).
      - name: Bootstrap Arch git for checkout
        if: matrix.label == 'arch-latest'
        shell: bash
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm
          pacman -S --noconfirm git
      - uses: actions/checkout@v7
      - name: Trust workspace for git (Arch container)
        if: matrix.label == 'arch-latest'
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup Arch Linux
        if: matrix.label == 'arch-latest'
        uses: ./.github/actions/setup-arch-linux
        with:
          pwsh-version: 7.4.7
      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # Pin to 5.7.x: Pester 5.9+ regresses Mock scoping ("Mock data are not setup for this scope")
          # and TestDrive collisions across sequential containers; Pester 6+ breaks tracer teardown.
          Install-Module -Name Pester -MinimumVersion 5.7.0 -MaximumVersion 5.7.99 -Force -Scope CurrentUser -AllowClobber
          $pester5 = Get-Module -ListAvailable Pester |
            Where-Object { $_.Version -ge [version]'5.7.0' -and $_.Version -lt [version]'5.8.0' } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $pester5) { throw 'Pester 5.7.x is required but was not installed' }
          Import-Module Pester -RequiredVersion $pester5.Version -Force
          Write-Host "Installed Pester $($pester5.Version)"
      - name: Run Pester shard
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File scripts/utils/code-quality/run-pester-ci-shard.ps1 -Shard '${{ matrix.shard }}' -Quiet
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-${{ matrix.label }}-${{ matrix.shard }}
          path: tests/test-artifacts/ci-${{ matrix.shard }}/**
          if-no-files-found: ignore
      - name: Upload coverage report
        if: matrix.shard == 'coverage-smoke' && matrix.label == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ubuntu-smoke
          path: |
            coverage.xml
            tests/test-artifacts/ci-coverage-smoke/**
