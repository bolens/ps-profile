name: Smoke check - repro

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'Microsoft.PowerShell_profile.ps1'
      - 'profile.d/**'
      - 'requirements/**'
      - 'scripts/checks/**'
      - 'scripts/lib/**'
      - '.github/workflows/smoke-check.yml'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  smoke-windows:
    name: Smoke check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run repro smoke script (verbose)
        shell: pwsh
        env:
          PS_PROFILE_DEBUG: '1'
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -Command "Write-Verbose 'Starting repro'; Set-PSDebug -Trace 0; & { pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/repro_set_agentmode.ps1 }"

      - name: Run Pester tests
        shell: pwsh
        env:
          PS_PROFILE_DEBUG: '1'
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/utils/code-quality/run-pester.ps1 -Parallel
