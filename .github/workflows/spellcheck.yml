name: Spellcheck (cspell)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.json'
      - 'cspell.json'
      - 'cspell*.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/spellcheck.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.json'
      - 'cspell.json'
      - 'cspell*.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/spellcheck.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  cspell:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.3
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run cspell
        run: |
          echo "Running cspell..."
          pnpm exec cspell "**/*" --no-progress --no-summary
        # NOTE: this step will fail the job if cspell finds issues. Remove or
        # adjust the config if you prefer warnings instead.
